name: Publish HAL API to GitHub Packages

# Publica manualmente o .aar do hal-api (co.stone.pos.mobile:hal-api-android e
# publications KMP irmãs) neste registry. Existe porque o GitHub Packages
# nunca aceita token de instalação de GitHub App como autenticação (confirmado
# com o time de SRE, mesmo com o App escopado pro repo certo) — só aceita PAT
# clássico ou o GITHUB_TOKEN automático, e este último só para pacotes que
# pertencem ao MESMO repo do workflow. Como `co.stone.pos.mobile:hal-api-*`
# pertence a este repo (pos-mobile-packages), não a pos-android-hal, o publish
# precisa rodar aqui, usando o GITHUB_TOKEN nativo deste repo — sem 401.
#
# Uso: depois de rodar "HAL API Release" em pos-android-hal (que cria a tag
# hal-api/x.y.z e o GitHub Release), rode esta action informando essa tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag do hal-api criada em pos-android-hal (ex: hal-api/3.6.6)'
        required: true

permissions:
  contents: read
  packages: write

env:
  # GitHub App (Hardware), App ID público — usado só pra checkout cross-repo
  # (contents:read em pos-android-hal). A private key vive no secret de
  # organização GH_HARDWARE_MAMBA_SETUP_PRIVATE_KEY.
  GH_APP_ID: 1070382

jobs:
  publish-hal-api:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token (cross-repo checkout only)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ env.GH_APP_ID }}
          private-key: ${{ secrets.GH_HARDWARE_MAMBA_SETUP_PRIVATE_KEY }}
          owner: stone-payments
          repositories: pos-android-hal

      - name: Checkout pos-android-hal at the release tag
        uses: actions/checkout@v4
        with:
          repository: stone-payments/pos-android-hal
          ref: ${{ inputs.tag }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup NDK and pin publish version
        run: |
          echo "ndk.dir=$ANDROID_HOME/ndk/20.0.5594570" >> local.properties
          # packageVersion em build.gradle resolve localPublishVersionName antes
          # do hal_api_version estático — isso faz a tag ser a versão efetiva.
          TAG="${{ inputs.tag }}"
          echo "localPublishVersionName=${TAG#hal-api/}" >> local.properties

      - name: Build Release
        env:
          # Necessário pra resolver o classpath do stone-plugin / pos.android.publish
          # do repositório PackageCloud declarado em settings.gradle/build.gradle.
          PACKAGECLOUD_READ_TOKEN: ${{ secrets.PACKAGECLOUD_READ_TOKEN }}
          PACKAGECLOUD_READ_TOKEN_INTERNAL: ${{ secrets.PACKAGECLOUD_READ_TOKEN_INTERNAL }}
        run: ./gradlew :hal-api:assembleRelease

      - name: Publish AAR to GitHub Packages
        env:
          PACKAGECLOUD_READ_TOKEN: ${{ secrets.PACKAGECLOUD_READ_TOKEN }}
          PACKAGECLOUD_READ_TOKEN_INTERNAL: ${{ secrets.PACKAGECLOUD_READ_TOKEN_INTERNAL }}
          GITHUB_PUBLISH_USERNAME: x-access-token
          # GITHUB_TOKEN nativo deste job — same-repo, com packages:write
          # declarado no permissions: acima. Este é o caminho oficialmente
          # suportado pelo GitHub Packages (ao contrário do token de App).
          GITHUB_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PACKAGES_REPOSITORY_URL: https://maven.pkg.github.com/stone-payments/pos-mobile-packages
        run: ./gradlew :hal-api:publishAllPublicationsToGitHubPackagesRepository
